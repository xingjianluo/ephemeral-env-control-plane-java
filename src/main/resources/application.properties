# ====== 临时环境控制平面（本地模拟）配置 ======
# 启动时写入演示模板/配额/主体
ecp.bootstrap-demo=true

# 列表/审计查询的条数硬上限（超限拒绝，要求分页）
ecp.list-max-limit=100

# 租约：默认 TTL、最大 TTL；自动到期扫描默认关闭（测试/本地需要时打开，或调用管理接口手动扫描）
ecp.lease.scan-enabled=false
ecp.lease.scan-interval-ms=1000
ecp.lease.default-ttl-seconds=300
ecp.lease.max-ttl-seconds=3600

# 到期扫描/收敛的每轮规模与耗时上限（超限即分页停止，下一轮继续）
ecp.scan.max-batch=50
ecp.scan.max-millis=200

logging.level.com.github.xingjianluo=INFO
